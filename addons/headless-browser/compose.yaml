name: open-webui-headless-browser
services:
  playwright:
    image: mcr.microsoft.com/playwright/mcp:latest
    restart: unless-stopped
    init: true
    entrypoint: ["node", "/app/cli.js"]
    command:
      - --headless
      - --browser
      - chromium
      - --no-sandbox
      - --isolated
      - --port
      - "8931"
      - --host
      - "0.0.0.0"
      - --allowed-hosts
      - "playwright:8931,localhost:8931,127.0.0.1:8931"
    shm_size: 1gb
    mem_limit: 2g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [browser]
  browser-tools:
    image: ghcr.io/open-webui/mcpo:main
    restart: unless-stopped
    init: true
    depends_on: [playwright]
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --api-key
      - "${BROWSER_TOOLS_API_KEY:?Run ./setup.sh first}"
      - --strict-auth
      - --server-type
      - streamable-http
      - --
      - http://playwright:8931/mcp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [browser, webui]
networks:
  browser: {}
  webui:
    external: true
    name: ${OPEN_WEBUI_NETWORK:-open-webui_default}
